name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format-check:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check formatting
        run: |
          python3 -m venv .venv
          .venv/bin/pip install clang-format==18.1.8
          git ls-files -z '*.cpp' '*.hpp' | xargs -0 -r .venv/bin/clang-format --dry-run --Werror

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Qt 5.15.3 (matches local dev)"
            os: ubuntu-22.04
            qt_package: qtbase5-dev

          - name: "Qt 6 (forward compatibility)"
            os: ubuntu-24.04
            qt_package: qt6-base-dev

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ${{ matrix.qt_package }} \
            libsqlite3-dev \
            libx11-dev

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
